name: Marauder C5 4MB
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: CLI
        run: |
          mkdir -pv /tmp/acli
          curl -fL https://downloads.arduino.cc/arduino-cli/arduino-cli_1.5.1_Linux_64bit.tar.gz -o /tmp/c.tgz
          tar -xzf /tmp/c.tgz -C /tmp/acli
          sudo install -m 755 /tmp/acli/arduino-cli /usr/local/bin/arduino-cli
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.4

      - name: Libs
        run: |
          git clone -q -b 1.6 --depth 1 https://github.com/marian-craciunescu/ESP32Ping CustomESP32Ping
          git clone -q -b v3.4.8 --depth 1 https://github.com/ESP32Async/AsyncTCP CustomAsyncTCP
          git clone -q -b v2.0.6 --depth 1 https://github.com/stevemarple/MicroNMEA CustomMicroNMEA
          git clone -q -b v3.8.1 --depth 1 https://github.com/ESP32Async/ESPAsyncWebServer CustomESPAsyncWebServer
          git clone -q -b 2.3.8 --depth 1 https://github.com/h2zero/NimBLE-Arduino CustomNimBLE
          git clone -q -b 1.12.0 --depth 1 https://github.com/adafruit/Adafruit_NeoPixel CustomNeoPixel
          git clone -q -b v6.18.2 --depth 1 https://github.com/bblanchon/ArduinoJson CustomArduinoJson
          git clone -q -b v1.3.3 --depth 1 https://github.com/ivanseidel/LinkedList CustomLinkedList
          git clone -q -b 8.1.0 --depth 1 https://github.com/plerup/espsoftwareserial CustomEspSoftwareSerial
          git clone -q -b 1.15.0 --depth 1 https://github.com/adafruit/Adafruit_BusIO CustomBusIO
          cp -r libraries/Adafruit_TCA8418 CustomTCA8418

      - name: Patch
        run: |
          find /home/runner/.arduino15/packages/esp32/hardware -name platform.txt -exec sed -i 's/compiler.c.elf.extra_flags=/compiler.c.elf.extra_flags=-Wl,-zmuldefs /' {} +
          find /home/runner/.arduino15/packages/esp32/tools/esp32-arduino-libs -name cpp_flags -exec sed -i 's/-fexceptions/-fno-exceptions/g' {} +

      - name: Build
        run: |
          L=""
          for d in Custom*/; do L="$L --library $d"; done
          arduino-cli compile --fqbn esp32:esp32:esp32c5:PartitionScheme=no_ota,PSRAM=disabled $L --warnings none --build-property compiler.cpp.extra_flags=-DMARAUDER_C5 --output-dir ./build esp32_marauder > b.log 2>&1 || true
          tail -40 b.log

      - name: Push
        run: |
          mkdir -p fw
          cp build/esp32_marauder.ino.bin fw/marauder.bin 2>/dev/null || echo "APP YOK" >> b.log
          cp build/esp32_marauder.ino.bootloader.bin fw/bootloader.bin 2>/dev/null || echo "BOOT YOK" >> b.log
          cp build/esp32_marauder.ino.partitions.bin fw/partitions.bin 2>/dev/null || echo "PART YOK" >> b.log
          git config user.name "ci-bot"
          git config user.email "ci@users.noreply.github.com"
          git add -f b.log fw
          git commit -m "c5 build output" || true
          git push origin HEAD:master || true
