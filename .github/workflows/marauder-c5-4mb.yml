name: Marauder C5 4MB
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: CLI
        run: |
          mkdir -pv /tmp/acli
          curl -fL https://downloads.arduino.cc/arduino-cli/arduino-cli_1.5.1_Linux_64bit.tar.gz -o /tmp/c.tgz
          tar -xzf /tmp/c.tgz -C /tmp/acli
          sudo install -m 755 /tmp/acli/arduino-cli /usr/local/bin/arduino-cli
          arduino-cli version
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.4

      - name: Libs
        run: |
          git clone -q --depth 1 https://github.com/marian-craciunescu/ESP32Ping CustomESP32Ping
          git clone -q --depth 1 https://github.com/ESP32Async/AsyncTCP CustomAsyncTCP
          git clone -q --depth 1 https://github.com/stevemarple/MicroNMEA CustomMicroNMEA
          git clone -q --depth 1 https://github.com/ESP32Async/ESPAsyncWebServer CustomESPAsyncWebServer
          git clone -q --depth 1 https://github.com/h2zero/NimBLE-Arduino CustomNimBLE
          git clone -q --depth 1 https://github.com/adafruit/Adafruit_NeoPixel CustomNeoPixel
          git clone -q --depth 1 https://github.com/bblanchon/ArduinoJson CustomArduinoJson
          git clone -q --depth 1 https://github.com/ivanseidel/LinkedList CustomLinkedList
          git clone -q --depth 1 https://github.com/plerup/espsoftwareserial CustomEspSoftwareSerial
          git clone -q --depth 1 https://github.com/adafruit/Adafruit_BusIO CustomBusIO
          cp -r libraries/Adafruit_TCA8418 CustomTCA8418
          ls -d Custom* >> $GITHUB_STEP_SUMMARY

      - name: Patch
        run: |
          find /home/runner/.arduino15/packages/esp32/hardware -name platform.txt -exec sed -i 's/compiler.c.elf.extra_flags=/compiler.c.elf.extra_flags=-Wl,-zmuldefs /' {} +
          find /home/runner/.arduino15/packages/esp32/tools/esp32-arduino-libs -name cpp_flags -exec sed -i 's/-fexceptions/-fno-exceptions/g' {} +
          echo patched >> $GITHUB_STEP_SUMMARY

      - name: Build
        run: |
          L=""
          for d in Custom*/; do L="$L --library $d"; done
          arduino-cli compile --fqbn esp32:esp32:esp32c5:FlashSize=4M,PartitionScheme=min_spiffs,PSRAM=disabled $L --warnings none --build-property compiler.cpp.extra_flags=-DMARAUDER_C5 --output-dir ./build esp32_marauder > /tmp/b.log 2>&1 || true
          tail -50 /tmp/b.log >> $GITHUB_STEP_SUMMARY
          ls -la build/ >> $GITHUB_STEP_SUMMARY 2>&1 || true

      - name: Pack
        run: |
          mkdir -p artifacts
          cp build/esp32_marauder.ino.bin artifacts/marauder.bin || echo noapp >> $GITHUB_STEP_SUMMARY
          cp build/esp32_marauder.ino.bootloader.bin artifacts/bootloader.bin || echo noboot >> $GITHUB_STEP_SUMMARY
          cp build/esp32_marauder.ino.partitions.bin artifacts/partitions.bin || echo nopart >> $GITHUB_STEP_SUMMARY
          ls -lh artifacts/ >> $GITHUB_STEP_SUMMARY

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: marauder-c5-4mb
          path: artifacts/
          retention-days: 7
          if-no-files-found: ignore
