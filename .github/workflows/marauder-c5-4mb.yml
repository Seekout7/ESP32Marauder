name: Build Marauder C5 4MB no-PSRAM
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Arduino CLI + ESP32 core 3.3.4
        run: |
          mkdir -pv /home/runner/bin
          curl -fL "https://downloads.arduino.cc/arduino-cli/arduino-cli_1.5.1_Linux_64bit.tar.gz" -o /tmp/cli.tar.gz
          tar -xzf /tmp/cli.tar.gz -C /home/runner/bin/
          chmod +x /home/runner/bin/arduino-cli
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.4
          arduino-cli core list >> $GITHUB_STEP_SUMMARY 2>&1

      - name: Install libraries
        run: |
          g() { git clone --depth 1 "$1" "Custom$2" || echo "FAIL: $2"; }
          g https://github.com/marian-craciunescu/ESP32Ping ESP32Ping
          g https://github.com/ESP32Async/AsyncTCP AsyncTCP
          g https://github.com/stevemarple/MicroNMEA MicroNMEA
          g https://github.com/ESP32Async/ESPAsyncWebServer ESPAsyncWebServer
          g https://github.com/h2zero/NimBLE-Arduino NimBLE-Arduino
          g https://github.com/adafruit/Adafruit_NeoPixel Adafruit_NeoPixel
          g https://github.com/bblanchon/ArduinoJson ArduinoJson
          g https://github.com/ivanseidel/LinkedList LinkedList
          g https://github.com/plerup/espsoftwareserial EspSoftwareSerial
          g https://github.com/adafruit/Adafruit_BusIO Adafruit_BusIO
          cp -r libraries/Adafruit_TCA8418 CustomAdafruit_TCA8418 2>/dev/null || echo "TCA8418 yok"
          ls -d Custom* | tee -a $GITHUB_STEP_SUMMARY

      - name: Patch platform (zmuldefs + no-exceptions)
        run: |
          for f in $(find /home/runner/.arduino15/packages/esp32/hardware/esp32/ -name platform.txt); do
            sed -i 's/compiler.c.elf.extra_flags=/compiler.c.elf.extra_flags=-Wl,-zmuldefs /' "$f"
          done
          for f in $(find /home/runner/.arduino15/packages/esp32/tools/esp32-arduino-libs/ -name cpp_flags); do
            sed -i 's/-fexceptions/-fno-exceptions/g' "$f"
          done
          echo "platform patch OK" >> $GITHUB_STEP_SUMMARY

      - name: Board info -> summary
        run: |
          arduino-cli board details -b "esp32:esp32:esp32c5" >> $GITHUB_STEP_SUMMARY 2>&1 || \
          arduino-cli board listall | grep -i c5 >> $GITHUB_STEP_SUMMARY 2>&1

      - name: Compile
        run: |
          FQBN="esp32:esp32:esp32c5:FlashSize=4M,PartitionScheme=min_spiffs,PSRAM=disabled"
          LIBS=""
          for d in Custom*/; do LIBS="$LIBS --library $d"; done
          arduino-cli compile --fqbn "$FQBN" $LIBS \
            --warnings none \
            --build-property "compiler.cpp.extra_flags=-DMARAUDER_C5" \
            --output-dir ./build \
            esp32_marauder > /tmp/compile.log 2>&1 || true
          tail -60 /tmp/compile.log >> $GITHUB_STEP_SUMMARY
          echo "=== SIZE ===" >> $GITHUB_STEP_SUMMARY
          ls -la build/ >> $GITHUB_STEP_SUMMARY 2>&1 || true

      - name: Upload firmware
        run: |
          if [ -f build/esp32_marauder.ino.bin ]; then
            mkdir -p artifacts
            cp build/esp32_marauder.ino.bin artifacts/marauder_c5_4mb.bin
            cp build/esp32_marauder.ino.bootloader.bin artifacts/bootloader.bin
            cp build/esp32_marauder.ino.partitions.bin artifacts/partitions.bin
            ls -lh artifacts/ >> $GITHUB_STEP_SUMMARY
          else
            echo "BUILD FAILED" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Publish
        uses: actions/upload-artifact@v4
        with:
          name: marauder-c5-4mb
          path: artifacts/
          retention-days: 7
          if-no-files-found: ignore

